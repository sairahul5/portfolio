<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="LYNEX_ — Web Developer and Designer"
    >

    <title>RAHUL_</title>

    <link rel="icon" type="image/png" href="Asserts/icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav class="navbar" id="navbar">

        <div class="container nav-inner">

            <a
                href="#top"
                class="logo"
                id="nav-name"
            >
                LYNEX_
            </a>

            <ul class="nav-links">

                <li>
                    <a href="#skills">Skills</a>
                </li>

                <li>
                    <a href="#projects">Projects</a>
                </li>

                <li>
                    <a href="#profile">Profile</a>
                </li>

                <li>
                    <a href="#contact">Contact</a>
                </li>

            </ul>

            <label
                class="switch"
                id="theme-toggle"
                title="Switch to dark mode"
            >
                <span class="sun" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false">
                        <g fill="#ffd43b">
                            <circle r="5" cy="12" cx="12"></circle>
                            <path d="m21 13h-1a1 1 0 0 1 0-2h1a1 1 0 0 1 0 2zm-17 0h-1a1 1 0 0 1 0-2h1a1 1 0 0 1 0 2zm13.66-5.66a1 1 0 0 1-.66-.29 1 1 0 0 1 0-1.41l.71-.71a1 1 0 1 1 1.41 1.41l-.71.71a1 1 0 0 1-.75.29zm-12.02 12.02a1 1 0 0 1-.71-.29 1 1 0 0 1 0-1.41l.71-.66a1 1 0 0 1 1.41 1.41l-.71.71a1 1 0 0 1-.7.24zm6.36-14.36a1 1 0 0 1-1-1v-1a1 1 0 0 1 2 0v1a1 1 0 0 1-1 1zm0 17a1 1 0 0 1-1-1v-1a1 1 0 0 1 2 0v1a1 1 0 0 1-1 1zm-5.66-14.66a1 1 0 0 1-.7-.29l-.71-.71a1 1 0 1 1 1.41-1.41l.71.71a1 1 0 0 1 0 1.41 1 1 0 0 1-.71.29zm12.02 12.02a1 1 0 0 1-.7-.29l-.66-.71a1 1 0 0 1 1.36-1.36l.71.71a1 1 0 0 1 0 1.41 1 1 0 0 1-.71.24z"></path>
                        </g>
                    </svg>
                </span>
                <span class="moon" aria-hidden="true">
                    <svg viewBox="0 0 384 512" focusable="false">
                        <path d="m223.5 32c-123.5 0-223.5 100.3-223.5 224s100 224 223.5 224c60.6 0 115.5-24.2 155.8-63.4 5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6-96.9 0-175.5-78.8-175.5-176 0-65.8 36-123.1 89.3-153.3 6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z"></path>
                    </svg>
                </span>
                <input type="checkbox" class="input" aria-label="Switch to dark mode">
                <span class="slider"></span>
            </label>

        </div>

    </nav>


    <main id="top">

        <!-- =========================
             HERO
        ========================== -->

        <header class="hero">

            <div class="container hero-content">

                <div class="hero-meta">

                    <span id="hero-role">
                        Loading...
                    </span>

                    <span
                        class="status"
                        id="hero-status"
                    ></span>

                </div>


                <h1 id="hero-name">
                    <div class="bouncing-loader">
                        <div class="bouncing-circle"></div>
                        <div class="bouncing-circle"></div>
                        <div class="bouncing-circle"></div>
                        <div class="bouncing-shadow"></div>
                        <div class="bouncing-shadow"></div>
                        <div class="bouncing-shadow"></div>
                    </div>
                </h1>


                <div class="hero-bottom">

                    <p
                        class="hero-description"
                        id="hero-description"
                    >
                        Loading...
                    </p>

                    <a
                        href="#projects"
                        class="hero-button"
                    >
                        <span>View Projects</span>
                        <span>↗</span>
                    </a>

                </div>

            </div>

        </header>


        <!-- =========================
             SKILLS
        ========================== -->

        <section
            id="skills"
            class="section"
        >

            <div class="container">

                <div class="section-heading">

                    <span class="section-number">
                        01
                    </span>

                    <span class="section-title">
                        SKILLS
                    </span>

                </div>


                <div
                    id="skills-container"
                    class="skills-grid"
                >

                    <div class="skeleton-loader">
                        <div class="skeleton-avatar"></div>
                        <div class="skeleton-content">
                            <div class="skeleton-title"></div>
                            <div class="skeleton-text"></div>
                        </div>
                        <div class="skeleton-dot"></div>
                    </div>

                    <div class="skeleton-loader">
                        <div class="skeleton-avatar"></div>
                        <div class="skeleton-content">
                            <div class="skeleton-title"></div>
                            <div class="skeleton-text"></div>
                        </div>
                        <div class="skeleton-dot"></div>
                    </div>

                    <div class="skeleton-loader">
                        <div class="skeleton-avatar"></div>
                        <div class="skeleton-content">
                            <div class="skeleton-title"></div>
                            <div class="skeleton-text"></div>
                        </div>
                        <div class="skeleton-dot"></div>
                    </div>

                </div>

            </div>

        </section>


        <!-- =========================
             PROJECTS
        ========================== -->

        <section
            id="projects"
            class="section"
        >

            <div class="container">

                <div class="section-heading">

                    <span class="section-number">
                        02
                    </span>

                    <span class="section-title">
                        PROJECTS
                    </span>

                </div>


                <div
                    id="projects-container"
                    class="projects-list"
                >

                    <div class="skeleton-loader">
                        <div class="skeleton-avatar"></div>
                        <div class="skeleton-content">
                            <div class="skeleton-title"></div>
                            <div class="skeleton-text"></div>
                        </div>
                        <div class="skeleton-dot"></div>
                    </div>

                    <div class="skeleton-loader">
                        <div class="skeleton-avatar"></div>
                        <div class="skeleton-content">
                            <div class="skeleton-title"></div>
                            <div class="skeleton-text"></div>
                        </div>
                        <div class="skeleton-dot"></div>
                    </div>

                    <div class="skeleton-loader">
                        <div class="skeleton-avatar"></div>
                        <div class="skeleton-content">
                            <div class="skeleton-title"></div>
                            <div class="skeleton-text"></div>
                        </div>
                        <div class="skeleton-dot"></div>
                    </div>

                </div>

            </div>

        </section>


        <!-- =========================
             PROFILE
        ========================== -->

        <section
            id="profile"
            class="section"
        >

            <div class="container">

                <div class="section-heading">

                    <span class="section-number">
                        03
                    </span>

                    <span class="section-title">
                        PROFILE
                    </span>

                </div>


                <div class="profile-grid">

                    <div class="profile-main">

                        <div id="profile-description-loading" class="profile-description-loading">
                            <div class="skeleton-loader" style="width: 100%; position: relative; left: -16px;">
                                <div class="skeleton-avatar" style="width: 100%; height: 200px; border-radius: 14px;"></div>
                            </div>
                        </div>

                        <p
                            id="profile-description"
                            class="profile-description"
                            style="display: none;"
                        >
                        </p>

                    </div>


                    <div
                        class="profile-info"
                        id="profile-info"
                    >
                        <div class="skeleton-loader">
                            <div class="skeleton-avatar"></div>
                            <div class="skeleton-content">
                                <div class="skeleton-title"></div>
                                <div class="skeleton-text"></div>
                            </div>
                            <div class="skeleton-dot"></div>
                        </div>

                        <div class="skeleton-loader">
                            <div class="skeleton-avatar"></div>
                            <div class="skeleton-content">
                                <div class="skeleton-title"></div>
                                <div class="skeleton-text"></div>
                            </div>
                            <div class="skeleton-dot"></div>
                        </div>

                        <div class="skeleton-loader">
                            <div class="skeleton-avatar"></div>
                            <div class="skeleton-content">
                                <div class="skeleton-title"></div>
                                <div class="skeleton-text"></div>
                            </div>
                            <div class="skeleton-dot"></div>
                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- =========================
             CONTACT
        ========================== -->

        <section
            id="contact"
            class="section contact-section"
        >

            <div class="container">

                <div class="section-heading">

                    <span class="section-number">
                        04
                    </span>

                    <span class="section-title">
                        CONTACT
                    </span>

                </div>


                <div class="contact-layout">

                    <div class="contact-copy">

                        <h2>
                            Have a project in mind?
                        </h2>

                        <p>
                            Send a message and I will get back to you.
                        </p>

                    </div>


                    <form
                        id="contact-form"
                        class="contact-form"
                    >

                        <div class="form-group">

                            <label for="contact-name">
                                Name
                            </label>

                            <input
                                id="contact-name"
                                name="name"
                                type="text"
                                placeholder="Your name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="contact-email">
                                Email
                            </label>

                            <input
                                id="contact-email"
                                name="email"
                                type="email"
                                placeholder="your@email.com"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="contact-message">
                                Message
                            </label>

                            <textarea
                                id="contact-message"
                                name="message"
                                placeholder="Your message"
                                required
                            ></textarea>

                        </div>


                        <button
                            id="submit-button"
                            type="submit"
                            class="submit-button"
                        >
                            <span>Send Message</span>
                            <span>↗</span>
                        </button>


                        <div
                            id="form-status"
                            class="form-status"
                        ></div>

                    </form>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <div class="container footer-inner">

            <span id="footer-name">
                LYNEX_
            </span>

            <!--<span>
                © <span id="footer-year"></span>
            </span>-->

        </div>

    </footer>


    <script src="script.js"></script>

</body>

</html>
