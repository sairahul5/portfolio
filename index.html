<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="LYNEX_ — Web Developer and Designer"
    >

    <title>LYNEX_</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav class="navbar" id="navbar">

        <div class="container nav-inner">

            <a
                href="#top"
                class="logo"
                id="nav-name"
            >
                LYNEX_
            </a>

            <ul class="nav-links">

                <li>
                    <a href="#skills">Skills</a>
                </li>

                <li>
                    <a href="#projects">Projects</a>
                </li>

                <li>
                    <a href="#profile">Profile</a>
                </li>

                <li>
                    <a href="#contact">Contact</a>
                </li>

            </ul>

        </div>

    </nav>


    <main id="top">

        <!-- =========================
             HERO
        ========================== -->

        <header class="hero">

            <div class="container hero-content">

                <div class="hero-meta">

                    <span id="hero-role">
                        Loading...
                    </span>

                    <span
                        class="status"
                        id="hero-status"
                    ></span>

                </div>


                <h1 id="hero-name">
                    Loading...
                </h1>


                <div class="hero-bottom">

                    <p
                        class="hero-description"
                        id="hero-description"
                    >
                        Loading...
                    </p>

                    <a
                        href="#projects"
                        class="hero-button"
                    >
                        <span>View Projects</span>
                        <span>↗</span>
                    </a>

                </div>

            </div>

        </header>


        <!-- =========================
             SKILLS
        ========================== -->

        <section
            id="skills"
            class="section"
        >

            <div class="container">

                <div class="section-heading">

                    <span class="section-number">
                        01
                    </span>

                    <span class="section-title">
                        SKILLS
                    </span>

                </div>


                <div
                    id="skills-container"
                    class="skills-grid"
                >

                    <div class="loading">
                        Loading skills...
                    </div>

                </div>

            </div>

        </section>


        <!-- =========================
             PROJECTS
        ========================== -->

        <section
            id="projects"
            class="section"
        >

            <div class="container">

                <div class="section-heading">

                    <span class="section-number">
                        02
                    </span>

                    <span class="section-title">
                        PROJECTS
                    </span>

                </div>


                <div
                    id="projects-container"
                    class="projects-list"
                >

                    <div class="loading">
                        Loading projects...
                    </div>

                </div>

            </div>

        </section>


        <!-- =========================
             PROFILE
        ========================== -->

        <section
            id="profile"
            class="section"
        >

            <div class="container">

                <div class="section-heading">

                    <span class="section-number">
                        03
                    </span>

                    <span class="section-title">
                        PROFILE
                    </span>

                </div>


                <div class="profile-grid">

                    <div class="profile-main">

                        <p
                            id="profile-description"
                            class="profile-description"
                        >
                            Loading...
                        </p>

                    </div>


                    <div
                        class="profile-info"
                        id="profile-info"
                    >
                        <div class="loading">
                            Loading profile...
                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- =========================
             CONTACT
        ========================== -->

        <section
            id="contact"
            class="section contact-section"
        >

            <div class="container">

                <div class="section-heading">

                    <span class="section-number">
                        04
                    </span>

                    <span class="section-title">
                        CONTACT
                    </span>

                </div>


                <div class="contact-layout">

                    <div class="contact-copy">

                        <h2>
                            Have a project in mind?
                        </h2>

                        <p>
                            Send a message and I will get back to you.
                        </p>

                    </div>


                    <form
                        id="contact-form"
                        class="contact-form"
                    >

                        <div class="form-group">

                            <label for="contact-name">
                                Name
                            </label>

                            <input
                                id="contact-name"
                                name="name"
                                type="text"
                                placeholder="Your name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="contact-email">
                                Email
                            </label>

                            <input
                                id="contact-email"
                                name="email"
                                type="email"
                                placeholder="your@email.com"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="contact-message">
                                Message
                            </label>

                            <textarea
                                id="contact-message"
                                name="message"
                                placeholder="Your message"
                                required
                            ></textarea>

                        </div>


                        <button
                            id="submit-button"
                            type="submit"
                            class="submit-button"
                        >
                            <span>Send Message</span>
                            <span>↗</span>
                        </button>


                        <div
                            id="form-status"
                            class="form-status"
                        ></div>

                    </form>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <div class="container footer-inner">

            <span id="footer-name">
                LYNEX_
            </span>

            <span>
                © <span id="footer-year"></span>
            </span>

        </div>

    </footer>


    <script src="script.js"></script>

</body>

</html>
